name: Sample
options:
  bundleIdPrefix: dev.farbun.feedback
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Feedback:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sample:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sample]
    dependencies:
      - package: Feedback
        product: FeedbackKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.farbun.feedback.sample
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  SampleUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [SampleUITests]
    dependencies:
      - target: Sample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.farbun.feedback.sample.uitests
        TEST_TARGET_NAME: Sample
schemes:
  Sample:
    build:
      targets:
        Sample: all
    test:
      targets: [SampleUITests]
      environmentVariables:
        FEEDBACK_SCREENSHOTS: /tmp
